<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Abrigo Patinhas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <img src="logo-patinhas.svg" alt="Logo Abrigo Patinhas" class="logo-login" />
      <div class="brand-title">Abrigo Patinhas</div>
      <div class="brand-subtitle">Abrigo e adoção de animais</div>
    </div>

    <div class="divider"></div>

    <!-- LOGIN -->
    <div id="viewLogin">
      <h1 class="login-heading">Entrar no Sistema</h1>
      <p class="login-sub">Acesse sua conta para continuar</p>
      <div id="loginAlert" class="alert alert-error"></div>

      <form id="formLogin">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="Digite seu email" required />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label class="form-label" for="loginSenha">Senha</label>
            <button type="button" id="btnAbrirRecuperar" class="forgot-link">Esqueceu a senha?</button>
          </div>
          <div class="input-wrapper">
            <input type="password" id="loginSenha" class="form-control" placeholder="Digite sua senha" required />
            <button type="button" id="btnToggleSenha" class="toggle-password" title="Mostrar/Ocultar senha">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="login-footer-text">Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
      <p class="login-footer-text" style="margin-top: 8px;">
        <a href="inicio.html" style="color: var(--texto-suave); font-weight: 500;">Entrar como visitante →</a>
      </p>
    </div>

    <!-- ESQUECEU A SENHA -->
    <div id="viewRecuperar" style="display: none;">
      <h1 class="login-heading">Recuperar Senha</h1>
      <p class="login-sub">Informe seu e-mail cadastrado para redefinir sua senha.</p>
      <div id="recuperarAlert" class="alert alert-success"></div>

      <form id="formRecuperar">
        <div class="form-group">
          <label class="form-label" for="recuperarEmail">Email cadastrado</label>
          <input type="email" id="recuperarEmail" class="form-control" placeholder="Digite seu email" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar instruções</button>
      </form>

      <p class="login-footer-text"><button type="button" id="btnVoltarLogin" class="forgot-link">← Voltar para o login</button></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
